    <script>
      (function (location) {
        if (location.search[1] === '/') {
          const decoded = location.search
            .slice(1)
            .split('&')
            .map((segment) => segment.replace(/~and~/g, '&'))
            .join('?');
          window.history.replaceState(null, '', decoded + location.hash);
        }
      }(window.location));
    </script>
    <script>
      (function () {
        var dark = true;
        try {
          var stored = localStorage.getItem('portfolio-theme-mode');
          if (stored === 'light') dark = false;
          else if (stored !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches) dark = false;
        } catch (e) {}
        document.documentElement.classList.toggle('dark', dark);
      }());
    </script>
